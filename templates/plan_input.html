{% extends "base.html" %}
{% block title %}Building Plan Input - 3D Building Visualization System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-custom p-4 shadow">
      <h3 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-info"></i>Enter Building Requirements</h3>
      <p class="text-secondary small mb-4">Provide project plot parameters, floor count, and architectural style to automatically generate the 3D model.</p>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Building Name</label>
          <input type="text" name="name" class="form-control bg-dark text-light border-secondary" placeholder="e.g. Emerald Heights" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Building Type</label>
            <select name="type" class="form-select bg-dark text-light border-secondary">
              <option value="Residential">Residential</option>
              <option value="Commercial">Commercial</option>
              <option value="Apartment">Apartment</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Number of Floors</label>
            <select name="floorCount" class="form-select bg-dark text-light border-secondary">
              <option value="1">1 (Ground Floor only)</option>
              <option value="2" selected>2 Floors</option>
              <option value="3">3 Floors</option>
              <option value="4">4 Floors</option>
              <option value="5">5 Floors</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Plot Width (meters)</label>
            <input type="number" name="plotWidth" class="form-control bg-dark text-light border-secondary" value="18" min="10" max="50">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Plot Length (meters)</label>
            <input type="number" name="plotLength" class="form-control bg-dark text-light border-secondary" value="16" min="10" max="50">
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Roof Style</label>
            <select name="roofStyle" class="form-select bg-dark text-light border-secondary">
              <option value="Flat Terrace">Flat Terrace (Parapet)</option>
              <option value="Sloped Pitch">Sloped Pitch (Gable)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Building Style</label>
            <select name="buildingStyle" class="form-select bg-dark text-light border-secondary">
              <option value="Modern Minimalist">Modern Minimalist</option>
              <option value="Glass Facade">Glass Facade</option>
              <option value="Classic Masonry">Classic Masonry</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-cyan px-4"><i class="bi bi-box me-1"></i>Generate 3D Model</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
