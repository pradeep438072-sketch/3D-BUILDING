{% extends "base.html" %}
{% block title %}Login - 3D Building Visualization System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-custom p-4 shadow">
      <h3 class="fw-bold mb-3 text-center"><i class="bi bi-shield-lock me-2 text-info"></i>Architect Login</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control bg-dark text-light border-secondary" value="demo" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control bg-dark text-light border-secondary" value="demo123" required>
        </div>
        <button type="submit" class="btn btn-cyan w-100 py-2">Sign In</button>
      </form>
      <div class="text-center mt-3 text-secondary small">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-info">Register here</a>
      </div>
      <div class="text-center mt-2 text-muted small">
        Demo credentials: <code>demo</code> / <code>demo123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
