{% extends "base.html" %}
{% block title %}Server Error - 3D Building Visualization System{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 text-center">
    <div class="card card-custom p-5 shadow">
      <i class="bi bi-exclamation-triangle display-2 text-warning mb-3"></i>
      <h2 class="fw-bold mb-2">Internal Server Error</h2>
      <p class="text-secondary mb-4">
        An error occurred while processing your architectural request.
      </p>
      {% if error %}
        <div class="alert alert-dark text-start font-monospace small mb-4">
          <code>{{ error }}</code>
        </div>
      {% endif %}
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-cyan"><i class="bi bi-house me-1"></i>Return Home</a>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
